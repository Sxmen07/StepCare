<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave Applications — StepCare Nurse Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 9999px; }
    .leave-row {
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .leave-row:hover {
      background-color: #f8fafc;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-white h-screen w-screen flex text-neutral-800 antialiased overflow-hidden">

  <!-- Modular Sidebar Container -->
  <div id="sidebar-container" class="shrink-0 h-full"></div>

  <!-- Main View Workspace -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <!-- Modular Topbar Container -->
    <div id="topbar-container" class="w-full shrink-0"></div>

    <!-- Sticky Sub-Bar: Filter & Apply Action -->
    <section class="sticky top-0 z-20 bg-white border-b border-neutral-200 px-8 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4 flex-1">
        <!-- Search Bar -->
        <div class="relative w-80">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400"></i>
          <input type="text" 
                 id="leave-search-input" 
                 placeholder="Search by date or reason..." 
                 class="w-full pl-9 pr-3 py-1.5 bg-neutral-50 border border-neutral-200 text-neutral-800 rounded-xl text-xs focus:outline-none focus:border-[#3C52C3] font-medium" />
        </div>

        <!-- Filter By Status -->
        <div class="flex items-center gap-1.5 text-xs text-neutral-500">
          <i data-lucide="filter" class="w-3.5 h-3.5"></i>
          <span class="font-medium">Status:</span>
          <select id="filter-status" class="bg-neutral-50 border border-neutral-200 text-neutral-800 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:border-[#3C52C3]">
            <option value="All">All Requests</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>

      <!-- Action Button: Apply Leave -->
      <button id="open-apply-modal-btn" type="button" class="px-5 py-2 bg-[#3C52C3] hover:bg-[#3245a8] text-white text-xs font-semibold rounded-xl transition flex items-center gap-2 cursor-pointer shadow-sm shrink-0">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Request Off-Day</span>
      </button>
    </section>

    <!-- Table Header Grid (Full-width 12 cols stream) -->
    <div class="grid grid-cols-12 px-8 py-3.5 text-[11px] font-bold text-neutral-400 uppercase tracking-wider border-b border-neutral-200 bg-neutral-50/60 items-center">
      <div class="col-span-2 text-left pl-2">Target Date</div>
      <div class="col-span-2 text-left">Time Frame</div>
      <div class="col-span-3 text-left">Reason / Note</div>
      <div class="col-span-1 text-center">Proof Doc</div>
      <div class="col-span-1 text-center">Status</div>
      <div class="col-span-3 text-center">Feedback / Action</div>
    </div>

    <!-- Full-Width Stream Container -->
    <main class="flex-1 overflow-y-auto custom-scrollbar">
      <div id="leaves-list-container" class="divide-y divide-neutral-100 w-full">
        <!-- Dynamic Rows Rendered Here -->
      </div>
    </main>
  </div>

  <!-- Apply Off-Day Modal -->
  <div id="apply-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 items-center justify-center hidden p-4">
    <div class="bg-white rounded-[2rem] p-8 w-full max-w-lg shadow-2xl border border-neutral-200">
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-neutral-100">
        <div>
          <h3 class="text-xl font-bold text-neutral-900">Request Off-Day</h3>
          <p class="text-xs text-neutral-400">Submit off-duty schedule for administrative approval</p>
        </div>
        <button type="button" id="close-apply-modal-x" class="text-neutral-400 hover:text-black cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="apply-leave-form" class="space-y-4">
        <!-- Target Date -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-1.5">Target Off Date</label>
          <input type="date" id="apply-date" required class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-[#3C52C3]" />
        </div>

        <!-- Full Day Checkbox Option -->
        <div class="p-3 bg-neutral-50 rounded-xl border border-neutral-200/80 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <input type="checkbox" id="apply-full-day" class="w-4 h-4 text-[#3C52C3] rounded border-neutral-300 focus:ring-0 cursor-pointer" />
            <label for="apply-full-day" class="text-xs font-bold text-neutral-800 cursor-pointer select-none">
              Full Day Leave
            </label>
          </div>
          <span class="text-[11px] text-neutral-400 font-medium">Off duty for the entire working day</span>
        </div>

        <!-- Specific Time Range Selection (Hidden if Full Day is Checked) -->
        <div id="time-range-wrapper" class="grid grid-cols-2 gap-3 transition-all duration-200">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-1.5">Start Time</label>
            <input type="time" id="apply-start-time" value="08:00" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-[#3C52C3]" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-1.5">End Time</label>
            <input type="time" id="apply-end-time" value="18:00" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-[#3C52C3]" />
          </div>
        </div>

        <!-- Reason / Note -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-1.5">Reason for Request</label>
          <textarea id="apply-reason" rows="3" required placeholder="Please describe your reason for requesting leave..." class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs font-medium focus:outline-none focus:border-[#3C52C3] transition resize-none"></textarea>
        </div>

        <!-- Multiple Upload Proof Documents -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-1.5">
            Proof Documents <span class="text-neutral-400 font-normal">(Optional, Multiple Files Supported)</span>
          </label>
          
          <!-- Drop Area -->
          <div id="upload-dropzone" class="relative border-2 border-dashed border-neutral-200 hover:border-[#3C52C3] rounded-2xl p-4 text-center transition bg-neutral-50/50 cursor-pointer">
            <input type="file" id="apply-proof-file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            <div class="space-y-1 pointer-events-none">
              <i data-lucide="upload-cloud" class="w-6 h-6 text-neutral-400 mx-auto"></i>
              <p class="text-xs font-semibold text-neutral-700">Click or drag files to upload</p>
              <p class="text-[10px] text-neutral-400">PDF, JPG, PNG, DOCX (Can select multiple)</p>
            </div>
          </div>

          <!-- Multiple Selected Files Container -->
          <div id="selected-files-list" class="space-y-2 mt-2.5">
            <!-- Dynamically populated files badges -->
          </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3 pt-4 border-t border-neutral-100">
          <button type="button" id="close-apply-modal-btn" class="px-5 py-2.5 border border-neutral-200 rounded-xl text-xs font-semibold hover:bg-neutral-50 transition cursor-pointer">Cancel</button>
          <button type="submit" id="submit-apply-btn" class="px-6 py-2.5 bg-[#3C52C3] hover:bg-[#3245a8] text-white rounded-xl text-xs font-semibold transition cursor-pointer shadow-sm">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // English comments only
    (function () {
      'use strict';

      let leavesList = [];
      let selectedFilesArray = []; // Store selected File objects

      document.addEventListener('DOMContentLoaded', () => {
        // 1. Mount nurse sidebar
        fetch('/StepCare/components/sidebar-nurse.html')
          .then(res => res.text())
          .then(html => {
            const sb = document.getElementById('sidebar-container');
            if (sb) {
              sb.innerHTML = html;
              sb.querySelectorAll('script').forEach(s => {
                const ns = document.createElement('script');
                ns.textContent = s.textContent;
                document.body.appendChild(ns);
              });
              if (window.lucide) lucide.createIcons();
            }
          });

        // 2. Mount topbar with title 'Leave Applications'
        fetch('/StepCare/components/topbar.html')
          .then(res => res.text())
          .then(html => {
            const tb = document.getElementById('topbar-container');
            if (tb) {
              tb.innerHTML = html;
              tb.querySelectorAll('script').forEach(s => {
                const ns = document.createElement('script');
                ns.textContent = s.textContent;
                document.body.appendChild(ns);
              });
              const title = document.getElementById('topbar-page-title');
              if (title) title.textContent = 'Leave Applications';
              if (window.lucide) lucide.createIcons();
            }
          });

        // 3. Set min date for date input to today
        resetDateInput();

        // 4. Load my leave applications
        loadMyLeaves();

        // 5. Bind events
        initEvents();
      });

      function resetDateInput() {
        const dateInput = document.getElementById('apply-date');
        if (dateInput) {
          const today = new Date().toISOString().split('T')[0];
          dateInput.min = today;
          dateInput.value = today;
        }
      }

      // Load leaves list using leave-actions.php
      async function loadMyLeaves() {
        try {
          const filterStatus = document.getElementById('filter-status');
          const currentStatus = filterStatus ? filterStatus.value.toLowerCase() : 'all';
          const res = await fetch(`./leave-actions.php?action=fetch_my_leaves&status=${currentStatus}`);
          const result = await res.json();
          if (result.status === 'success') {
            leavesList = result.data || [];
            renderTable();
          } else {
            console.error('Fetch error:', result.message);
            renderTable();
          }
        } catch (err) {
          console.error('Network error:', err);
          renderTable();
        }
      }

      // Render table rows
      function renderTable() {
        const container = document.getElementById('leaves-list-container');
        const searchInput = document.getElementById('leave-search-input');
        const filterStatus = document.getElementById('filter-status');

        const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';
        const currentStatus = filterStatus ? filterStatus.value.toLowerCase() : 'all';

        const filtered = leavesList.filter(item => {
          const matchesStatus = (currentStatus === 'all') || (item.status.toLowerCase() === currentStatus);
          const matchesSearch = item.requestDate.toLowerCase().includes(searchTerm) || 
                                item.reason.toLowerCase().includes(searchTerm);
          return matchesStatus && matchesSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="py-24 text-center">
              <div class="w-12 h-12 rounded-full bg-neutral-100 text-neutral-400 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="calendar-off" class="w-6 h-6"></i>
              </div>
              <p class="text-sm font-semibold text-neutral-600">No leave requests found</p>
              <p class="text-xs text-neutral-400 mt-1">You haven't submitted any off-day applications matching this filter.</p>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
          return;
        }

        container.innerHTML = filtered.map(item => {
          const st = item.status.toLowerCase();
          let statusBadge = '';
          if (st === 'pending') {
            statusBadge = '<span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold border bg-amber-50 text-amber-700 border-amber-200">Pending</span>';
          } else if (st === 'approved') {
            statusBadge = '<span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200">Approved</span>';
          } else {
            statusBadge = '<span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold border bg-rose-50 text-rose-700 border-rose-200">Rejected</span>';
          }

          // Proof Documents Links
          let proofCell = `<span class="text-neutral-300 text-xs">—</span>`;
          if (item.proofFiles && item.proofFiles.length > 0) {
            proofCell = `
              <div class="flex items-center justify-center gap-1.5 flex-wrap">
                ${item.proofFiles.map((f, i) => `
                  <a href="${f}" target="_blank" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-neutral-100 hover:bg-neutral-200 text-neutral-700 text-[11px] font-semibold transition" title="View Document ${i+1}">
                    <i data-lucide="paperclip" class="w-3 h-3 text-[#3C52C3]"></i>
                    <span>Doc ${i+1}</span>
                  </a>
                `).join('')}
              </div>
            `;
          }

          // Actions / Feedback
          let feedbackCell = '';
          if (st === 'pending') {
            feedbackCell = `
              <button type="button" 
                      onclick="window.cancelApplication(${item.requestId})" 
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-neutral-50 text-neutral-600 hover:text-rose-600 text-xs font-semibold rounded-lg border border-neutral-200 hover:border-rose-200 shadow-2xs transition cursor-pointer">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>Withdraw</span>
              </button>
            `;
          } else if (st === 'rejected') {
            const reasonText = item.rejectionReason || 'No feedback provided';
            feedbackCell = `
              <div class="text-left text-xs text-rose-600 font-medium truncate max-w-xs" title="${reasonText}">
                <span class="font-bold">Reason:</span> ${reasonText}
              </div>
            `;
          } else {
            feedbackCell = `
              <span class="text-xs text-emerald-600 font-medium">Approved by ${item.reviewedBy || 'Admin'}</span>
            `;
          }

          return `
            <div class="leave-row grid grid-cols-12 items-center px-8 py-3.5 border-b border-neutral-100">
              
              <!-- Col 1: Target Date -->
              <div class="col-span-2 text-xs font-bold text-neutral-900 pl-2">
                ${item.requestDate}
              </div>

              <!-- Col 2: Time Frame -->
              <div class="col-span-2 text-xs font-semibold ${item.isFullDay ? 'text-[#3C52C3]' : 'font-mono text-neutral-500'}">
                ${item.timeDisplay}
              </div>

              <!-- Col 3: Reason -->
              <div class="col-span-3 text-xs text-neutral-700 truncate pr-4" title="${item.reason}">
                ${item.reason}
              </div>

              <!-- Col 4: Proof Doc -->
              <div class="col-span-1 text-center">
                ${proofCell}
              </div>

              <!-- Col 5: Status -->
              <div class="col-span-1 text-center">
                ${statusBadge}
              </div>

              <!-- Col 6: Feedback / Withdraw -->
              <div class="col-span-3 flex items-center justify-center">
                ${feedbackCell}
              </div>

            </div>
          `;
        }).join('');

        if (window.lucide) lucide.createIcons();
      }

      // Withdraw application
      window.cancelApplication = async function(requestId) {
        if (!confirm('Are you sure you want to withdraw this pending leave application?')) return;

        try {
          const res = await fetch('./leave-actions.php?action=cancel_leave', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId })
          });
          const result = await res.json();
          if (result.status === 'success') {
            await loadMyLeaves();
          } else {
            alert(result.message || 'Withdrawal failed');
          }
        } catch (err) {
          alert('Network error: ' + err.message);
        }
      };

      // Render Selected Multiple Files in Modal
      function renderSelectedFiles() {
        const container = document.getElementById('selected-files-list');
        if (!container) return;

        if (selectedFilesArray.length === 0) {
          container.innerHTML = '';
          return;
        }

        container.innerHTML = selectedFilesArray.map((file, idx) => `
          <div class="flex items-center justify-between p-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs">
            <div class="flex items-center gap-2 min-w-0 pr-2">
              <i data-lucide="file-text" class="w-4 h-4 text-[#3C52C3] shrink-0"></i>
              <span class="font-medium text-neutral-800 truncate">${file.name}</span>
              <span class="text-[10px] text-neutral-400">(${(file.size / 1024).toFixed(1)} KB)</span>
            </div>
            <button type="button" onclick="window.removeSelectedFile(${idx})" class="text-neutral-400 hover:text-rose-600 transition p-1 cursor-pointer">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      }

      window.removeSelectedFile = function(index) {
        selectedFilesArray.splice(index, 1);
        renderSelectedFiles();
      };

      // Reset Modal Form completely
      function resetModalForm() {
        const form = document.getElementById('apply-leave-form');
        if (form) form.reset();
        selectedFilesArray = [];
        renderSelectedFiles();
        document.getElementById('time-range-wrapper').classList.remove('hidden');
        resetDateInput();
      }

      // Events
      function initEvents() {
        const searchInput = document.getElementById('leave-search-input');
        if (searchInput) searchInput.addEventListener('input', renderTable);

        const filterStatus = document.getElementById('filter-status');
        if (filterStatus) filterStatus.addEventListener('change', loadMyLeaves);

        // Full Day Checkbox toggle
        const fullDayCheckbox = document.getElementById('apply-full-day');
        const timeRangeWrapper = document.getElementById('time-range-wrapper');
        const startTimeInput = document.getElementById('apply-start-time');
        const endTimeInput = document.getElementById('apply-end-time');

        fullDayCheckbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            timeRangeWrapper.classList.add('hidden');
            startTimeInput.required = false;
            endTimeInput.required = false;
          } else {
            timeRangeWrapper.classList.remove('hidden');
            startTimeInput.required = true;
            endTimeInput.required = true;
          }
        });

        // Multiple file input handling
        const fileInput = document.getElementById('apply-proof-file');
        fileInput.addEventListener('change', (e) => {
          if (e.target.files) {
            for (let i = 0; i < e.target.files.length; i++) {
              selectedFilesArray.push(e.target.files[i]);
            }
            renderSelectedFiles();
            fileInput.value = ''; // Reset input to allow re-selection
          }
        });

        // Modal controls with automatic reset
        const modal = document.getElementById('apply-modal');
        const openBtn = document.getElementById('open-apply-modal-btn');
        const closeBtn = document.getElementById('close-apply-modal-btn');
        const closeX = document.getElementById('close-apply-modal-x');

        const showModal = () => { 
          resetModalForm();
          modal.classList.remove('hidden'); 
          modal.classList.add('flex'); 
        };

        const hideModal = () => { 
          modal.classList.add('hidden'); 
          modal.classList.remove('flex'); 
          resetModalForm();
        };

        if (openBtn) openBtn.onclick = showModal;
        if (closeBtn) closeBtn.onclick = hideModal;
        if (closeX) closeX.onclick = hideModal;

        // Submit form
        const form = document.getElementById('apply-leave-form');
        form.onsubmit = async (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submit-apply-btn');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Submitting...';

          const isFull = fullDayCheckbox.checked;
          const formData = new FormData();
          formData.append('requestDate', document.getElementById('apply-date').value);
          formData.append('isFullDay', isFull ? 'true' : 'false');
          formData.append('reason', document.getElementById('apply-reason').value.trim());

          if (!isFull) {
            formData.append('startTime', startTimeInput.value);
            formData.append('endTime', endTimeInput.value);
          }

          // Append multiple files
          selectedFilesArray.forEach((file) => {
            formData.append('proofDocuments[]', file);
          });

          try {
            const res = await fetch('./leave-actions.php?action=submit_leave', {
              method: 'POST',
              body: formData
            });

            const text = await res.text();
            let result;
            try {
              result = JSON.parse(text);
            } catch (err) {
              throw new Error(text || 'Invalid response from server');
            }

            if (result.status === 'success') {
              hideModal();
              await loadMyLeaves();
            } else {
              alert(result.message || 'Submission failed');
            }
          } catch (err) {
            alert('Request error: ' + err.message);
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Request';
          }
        };
      }
    })();
  </script>
</body>
</html>

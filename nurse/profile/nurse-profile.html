<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurse Profile — StepCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 9999px; }
  </style>
</head>
<body class="bg-white text-neutral-800 font-sans antialiased flex h-screen overflow-hidden">

  <!-- Mount Point for Nurse Sidebar -->
  <div id="sidebar-container" class="shrink-0 h-full flex"></div>

  <!-- Main View Container -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-white">
    
    <!-- Mount Point for Topbar -->
    <div id="topbar-container" class="w-full shrink-0"></div>

    <!-- Scrollable Main View -->
    <main class="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar bg-white">
      <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          
          <!-- Left: Profile Card -->
          <div class="lg:col-span-4 bg-white border border-neutral-200/90 rounded-[2.5rem] p-8 shadow-sm flex flex-col items-center text-center">
            
            <!-- Avatar Section -->
            <div class="relative mb-6">
              <div class="w-36 h-36 rounded-full bg-neutral-100 flex items-center justify-center overflow-hidden border-4 border-neutral-50 shadow-inner">
                <img id="nurse-avatar-img" 
                     src="/StepCare/images/default.jpg" 
                     alt="" 
                     class="w-full h-full object-cover"
                     onerror="this.src='/StepCare/images/default.jpg';" />
              </div>

              <input type="file" id="avatar-file-input" accept="image/*" class="hidden" />

              <button id="btn-trigger-upload" 
                      type="button" 
                      title="Change Profile Picture"
                      class="absolute bottom-1 right-1 w-10 h-10 rounded-full bg-[#3C52C3] hover:bg-[#3245a8] text-white flex items-center justify-center shadow-md border-2 border-white transition transform active:scale-95 cursor-pointer">
                <i data-lucide="camera" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Nurse Name -->
            <h2 id="card-nurse-name" class="text-xl font-black text-neutral-900 uppercase tracking-wide mb-1">
              -
            </h2>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-bold bg-indigo-50 text-[#3C52C3] border border-indigo-200 mb-8">
              Registered Nurse
            </span>

            <!-- Info Pill Rows -->
            <div class="w-full space-y-4 mb-8">
              <div class="w-full py-3.5 px-6 rounded-2xl border border-neutral-200 bg-white text-left shadow-2xs">
                <p class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-0.5">Name</p>
                <p id="info-nurse-name" class="text-sm font-bold text-neutral-800 truncate">-</p>
              </div>

              <div class="w-full py-3.5 px-6 rounded-2xl border border-neutral-200 bg-white text-left shadow-2xs">
                <p class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-0.5">Email</p>
                <p id="info-nurse-email" class="text-sm font-bold text-neutral-800 truncate">-</p>
              </div>

              <div class="w-full py-3.5 px-6 rounded-2xl border border-neutral-200 bg-white text-left shadow-2xs flex items-center justify-between">
                <div>
                  <p class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-0.5">Password</p>
                  <p class="text-sm font-bold text-neutral-800 tracking-widest leading-none">••••••••••</p>
                </div>
                <i data-lucide="lock" class="w-4 h-4 text-neutral-400"></i>
              </div>
            </div>

            <!-- Edit Button -->
            <button id="open-edit-modal-btn" type="button" class="w-36 py-3 bg-[#6979F8] hover:bg-[#5868e8] text-white rounded-2xl text-xs font-black uppercase tracking-wider transition shadow-sm cursor-pointer">
              Edit
            </button>
          </div>

          <!-- Right: Metrics & Nurse Schedule -->
          <div class="lg:col-span-8 flex flex-col gap-8">
            
            <!-- Metric Card: Today's Appointments -->
            <div class="bg-white border border-neutral-200/90 rounded-[2.5rem] p-7 shadow-sm flex items-center justify-between relative overflow-hidden">
              <div>
                <p class="text-xs font-bold text-neutral-500 uppercase tracking-wider">Today's Appointments</p>
                <h3 id="stat-today-num" class="text-4xl font-black text-neutral-900 mt-2">0</h3>
                <p id="stat-today-desc" class="text-xs text-neutral-400 mt-1 font-medium">All appointments completed</p>
              </div>

              <div id="stat-icon-wrapper" class="w-16 h-16 rounded-2xl flex items-center justify-center shrink-0 bg-emerald-50 text-emerald-600">
                <i id="stat-icon" data-lucide="check" class="w-8 h-8"></i>
              </div>
            </div>

            <!-- Today's Assigned Schedule Table -->
            <div class="bg-white border border-neutral-200/90 rounded-[2.5rem] p-8 shadow-sm flex flex-col min-h-[420px]">
              <div class="flex items-center justify-between border-b border-neutral-100 pb-4 mb-6">
                <div>
                  <h3 class="text-base font-bold text-neutral-900">Today's Duty & Schedule</h3>
                  <p class="text-xs text-neutral-400">Real-time appointments assigned to your shift</p>
                </div>
                <span class="text-xs font-medium text-neutral-400">Assigned To Me</span>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                  <thead>
                    <tr class="text-[11px] font-bold text-neutral-400 uppercase tracking-wider border-b border-neutral-100">
                      <th class="py-3 px-4">Date</th>
                      <th class="py-3 px-4">Time Slot</th>
                      <th class="py-3 px-4">Service</th>
                      <th class="py-3 px-4 text-right">Status</th>
                    </tr>
                  </thead>
                  <tbody id="nurse-slots-body" class="divide-y divide-neutral-100 font-medium text-neutral-700">
                    <!-- Dynamic rendering -->
                  </tbody>
                </table>
              </div>
            </div>

          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Edit Nurse Modal -->
  <div id="edit-profile-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 items-center justify-center hidden p-4">
    <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-lg shadow-2xl border border-neutral-200">
      
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-neutral-100">
        <div>
          <h3 class="text-lg font-bold text-neutral-900">Edit Nurse Profile</h3>
          <p class="text-xs text-neutral-400">Update credentials and personal details</p>
        </div>
        <button type="button" id="close-modal-x" class="text-neutral-400 hover:text-black cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="nurse-edit-form" class="space-y-4">
        <div class="p-4 rounded-2xl border border-neutral-100 bg-neutral-50/50">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-neutral-500 mb-1.5">First Name</label>
          <input type="text" id="edit-nurse-first-name" required class="w-full px-4 py-2.5 bg-white border border-neutral-200 rounded-xl text-xs font-semibold focus:border-[#3C52C3] focus:outline-none" />
        </div>

        <div class="p-4 rounded-2xl border border-neutral-100 bg-neutral-50/50">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-neutral-500 mb-1.5">Last Name</label>
          <input type="text" id="edit-nurse-last-name" class="w-full px-4 py-2.5 bg-white border border-neutral-200 rounded-xl text-xs font-semibold focus:border-[#3C52C3] focus:outline-none" />
        </div>

        <div class="p-4 rounded-2xl border border-neutral-100 bg-neutral-50/50">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-neutral-500 mb-1.5">Email Address</label>
          <input type="email" id="edit-nurse-email" required class="w-full px-4 py-2.5 bg-white border border-neutral-200 rounded-xl text-xs font-semibold focus:border-[#3C52C3] focus:outline-none" />
        </div>

        <div class="p-4 rounded-2xl border border-neutral-100 bg-neutral-50/50">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-neutral-500 mb-1.5">New Password</label>
          <input type="password" id="edit-nurse-password" placeholder="Leave blank to keep unchanged" class="w-full px-4 py-2.5 bg-white border border-neutral-200 rounded-xl text-xs font-semibold focus:border-[#3C52C3] focus:outline-none" />
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-neutral-100">
          <button type="button" id="close-modal-btn" class="px-5 py-2.5 border border-neutral-200 rounded-xl text-xs font-semibold hover:bg-neutral-50 transition cursor-pointer">Cancel</button>
          <button type="submit" id="save-profile-btn" class="px-6 py-2.5 bg-[#3C52C3] hover:bg-[#3245a8] text-white rounded-xl text-xs font-semibold transition cursor-pointer shadow-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./nurse-profile.js"></script>
</body>
</html>

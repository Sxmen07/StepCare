<script>
document.addEventListener('DOMContentLoaded', function() {
    /* ============================================================
       1. DROPDOWN BEHAVIOR
       ============================================================ */
    function setupDropdown(toggleId, dropdownId, menuId) {
        const toggle   = document.getElementById(toggleId);
        const dropdown = document.getElementById(dropdownId);
        const menu     = document.getElementById(menuId);
        if (!toggle || !dropdown || !menu) return;

        toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            document.querySelectorAll('.header-dropdown').forEach(d => {
                if (d !== dropdown) d.classList.add('hidden');
            });
            dropdown.classList.toggle('hidden');
        });
    }

    const profileDrop = document.getElementById('profileDropdown');
    const notifDrop   = document.getElementById('notificationDropdown');
    if (profileDrop) profileDrop.classList.add('header-dropdown');
    if (notifDrop)   notifDrop.classList.add('header-dropdown');

    setupDropdown('profileToggle',      'profileDropdown',      'profileMenu');
    setupDropdown('notificationToggle', 'notificationDropdown', 'notificationMenu');

    // Click outside closes all
    document.addEventListener('click', function (e) {
        document.querySelectorAll('.header-dropdown').forEach(d => {
            const menu = d.parentElement;
            if (menu && !menu.contains(e.target)) d.classList.add('hidden');
        });
    });

    // ESC closes all
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            document.querySelectorAll('.header-dropdown').forEach(d => d.classList.add('hidden'));
        }
    });

    /* ============================================================
       2. NOTIFICATION MARK AS READ / UNREAD LOGIC
       ============================================================ */
    const markAllBtn = document.getElementById('markAllReadBtn');
    const notifList  = document.getElementById('notificationList');
    const headerBadge = document.getElementById('headerNotifBadge');
    
    // Function to send AJAX request
    function updateNotificationStatus(id, status, callback) {
        fetch('/StepCare/user/headerNfooter/header/markNotification.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `id=${id}&status=${status}`
        })
        .then(res => res.json())
        .then(data => {
            if (data.success && callback) callback();
        })
        .catch(err => console.error('Error updating notification:', err));
    }

    // Handle individual toggle buttons
    if (notifList) {
        notifList.addEventListener('click', function(e) {
            const toggleBtn = e.target.closest('.notif-toggle-btn');
            if (!toggleBtn) return;

            e.preventDefault();
            e.stopPropagation();

            const id         = toggleBtn.dataset.id;
            const currentVal = parseInt(toggleBtn.dataset.isread);
            const newVal     = currentVal === 1 ? 0 : 1;

            updateNotificationStatus(id, newVal, () => {
                // Update UI
                toggleBtn.dataset.isread = newVal;
                const row = document.getElementById(`notif-row-${id}`);
                const dot = row.querySelector('.unread-dot');
                
                if (newVal === 1) {
                    row.classList.remove('bg-slate-50/80');
                    row.classList.add('bg-white');
                    dot.classList.add('hidden');
                    toggleBtn.title = 'Mark as unread';
                    toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 9v.906a2.25 2.25 0 01-1.183 1.981l-6.478 3.488M2.25 9v.906a2.25 2.25 0 001.183 1.981l6.478 3.488m8.839 2.51l-4.66-2.51m0 0l-1.023-.55a2.25 2.25 0 00-2.134 0l-1.022.55m0 0l-4.661 2.51m16.5 1.615a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V8.844a2.25 2.25 0 011.183-1.98l7.5-4.04a2.25 2.25 0 012.134 0l7.5 4.04a2.25 2.25 0 011.183 1.98v7.491z" /></svg>';
                } else {
                    row.classList.remove('bg-white');
                    row.classList.add('bg-slate-50/80');
                    dot.classList.remove('hidden');
                    toggleBtn.title = 'Mark as read';
                    toggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" /></svg>';
                }
                
                // Show red dot if there are unread notifications
                if (headerBadge) {
                    if (newVal === 0) {
                        headerBadge.classList.remove('hidden');
                    } else {
                        // Check if ANY dots are left unread
                        const unreadDots = document.querySelectorAll('.unread-dot:not(.hidden)');
                        if (unreadDots.length === 0) {
                            headerBadge.classList.add('hidden');
                        }
                    }
                }
            });
        });
    }

    // Handle "Mark all read" button
    if (markAllBtn) {
        markAllBtn.addEventListener('click', function(e) {
            e.preventDefault();
            fetch('/StepCare/user/headerNfooter/header/markNotification.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'mark_all=1'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Update all UI elements
                    document.querySelectorAll('.notif-toggle-btn').forEach(btn => {
                        btn.dataset.isread = 1;
                        btn.title = 'Mark as unread';
                        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 9v.906a2.25 2.25 0 01-1.183 1.981l-6.478 3.488M2.25 9v.906a2.25 2.25 0 001.183 1.981l6.478 3.488m8.839 2.51l-4.66-2.51m0 0l-1.023-.55a2.25 2.25 0 00-2.134 0l-1.022.55m0 0l-4.661 2.51m16.5 1.615a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V8.844a2.25 2.25 0 011.183-1.98l7.5-4.04a2.25 2.25 0 012.134 0l7.5 4.04a2.25 2.25 0 011.183 1.98v7.491z" /></svg>';
                    });
                    document.querySelectorAll('.unread-dot').forEach(dot => dot.classList.add('hidden'));
                    document.querySelectorAll('[id^="notif-row-"]').forEach(row => {
                        row.classList.remove('bg-slate-50/80');
                        row.classList.add('bg-white');
                    });
                    
                    markAllBtn.remove(); // Hide the button
                    if (headerBadge) headerBadge.classList.add('hidden'); // Hide red dot
                }
            });
        });
    }
});

// Helper function for clicking the main link (marks as read without waiting)
function markAsReadBeforeNav(id) {
    fetch('/StepCare/user/headerNfooter/header/markNotification.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `id=${id}&status=1`
    }).catch(err => console.error(err));
}
</script>

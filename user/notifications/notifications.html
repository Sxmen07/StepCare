          <?php
            // Calculate time ago
            $notifTime = strtotime($notif['createdAt']);
            $timeDiff  = time() - $notifTime;
            
            if ($timeDiff < 60) {
                $timeAgo = 'Just now';
            } elseif ($timeDiff < 3600) {
                $timeAgo = floor($timeDiff / 60) . ' mins ago';
            } elseif ($timeDiff < 86400) {
                $timeAgo = floor($timeDiff / 3600) . ' hours ago';
            } else {
                $timeAgo = date('d M Y, g:i A', $notifTime);
            }

            $isRead  = (int)$notif['isRead'];
            $bgClass = $isRead ? 'bg-white' : 'bg-blue-50/50 border-blue-100';
            $url     = $notif['linkURL'] ?: '/StepCare/user/appointments/appointments.php';
          ?>
          
          <!-- Notification Card -->
          <div class="notif-item flex items-center justify-between p-4 rounded-2xl border border-slate-200 <?= $bgClass ?> transition hover:shadow-md"

               data-status="<?= $isRead ? 'read' : 'unread' ?>">
            
            <a href="<?= htmlspecialchars($url) ?>"

               onclick="markAsReadBeforeNav(<?= $notif['notificationID'] ?>)">

              <div class="flex-shrink-0 mt-1.5 unread-dot <?= $isRead ? 'hidden' : '' ?>">

              </div>

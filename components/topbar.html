<!-- Global Self-Contained Topbar Component for Both Admin & Nurse -->
<header id="topbar" class="bg-white border-b border-neutral-200 h-20 px-8 flex items-center justify-between sticky top-0 z-30 select-none">
  
  <!-- Left: Dynamic Title -->
  <div class="flex items-center gap-3">
    <h1 id="topbar-page-title" class="text-2xl font-black text-neutral-900 tracking-tight">
      Dashboard
    </h1>
  </div>

  <!-- Right: Bell Notification & User Profile -->
  <div class="flex items-center gap-6">
    
    <!-- Notification Bell Button -->
    <div class="relative flex items-center">
      <button id="topbar-notif-btn" type="button" class="relative p-2 text-neutral-600 hover:text-black transition cursor-pointer flex items-center justify-center focus:outline-none">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <!-- Indicator Dot -->
        <span id="topbar-notif-dot" style="display: none;" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-[#3C52C3] rounded-full ring-2 ring-white"></span>
      </button>

      <!-- Enlarged Dropdown Panel -->
      <div id="topbar-notif-dropdown" class="hidden absolute right-0 top-full mt-3 w-96 bg-white rounded-3xl shadow-2xl border border-neutral-200 p-5 z-50 transition-all">
        
        <div class="flex items-center justify-between pb-3.5 mb-2 border-b border-neutral-100">
          <div class="flex items-center gap-2">
            <h3 class="text-base font-bold text-neutral-900">Notifications</h3>
            <span id="topbar-notif-count" class="text-[11px] bg-indigo-50 text-[#3C52C3] font-bold px-2.5 py-0.5 rounded-full">0 unread</span>
          </div>
          <button id="topbar-mark-all-read" type="button" class="text-xs font-semibold text-neutral-500 hover:text-[#3C52C3] transition cursor-pointer">
            Mark all read
          </button>
        </div>

        <div id="topbar-notif-list" class="divide-y divide-neutral-100 max-h-80 overflow-y-auto pr-1">
          <!-- Rendered stream items -->
        </div>

        <div class="pt-3 mt-2 border-t border-neutral-100 text-center">
          <a id="topbar-see-all-notif" href="/StepCare/admin/notifications/notifications.html" class="block py-2 text-xs font-bold text-[#3C52C3] hover:text-[#2e3e94] hover:bg-neutral-50 rounded-xl transition">
            See all notifications &rarr;
          </a>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown Anchor -->
    <div class="relative flex items-center">
      <button id="user-menu-btn" type="button" class="w-10 h-10 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-sm hover:ring-4 hover:ring-neutral-100 transition cursor-pointer overflow-hidden border border-neutral-300">
        <span id="topbar-avatar-initials">A</span>
      </button>

      <!-- Dropdown Card -->
      <div id="user-dropdown-menu" class="hidden absolute right-0 top-full mt-3 w-56 bg-white rounded-2xl shadow-xl border border-neutral-200 py-2.5 z-50">
        <div class="px-4 py-2.5 border-b border-neutral-100">
          <p class="text-[11px] font-medium text-neutral-400">Signed in as</p>
          <p id="topbar-user-name" class="text-sm font-bold text-neutral-800 truncate mt-0.5">User</p>
        </div>

        <div class="py-1">
          <a id="topbar-profile-link" href="/StepCare/admin/profile/admin-profile.html" class="flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-neutral-700 hover:text-[#3C52C3] hover:bg-neutral-50 transition">
            <i data-lucide="user" class="w-4 h-4 text-neutral-400"></i>
            <span>My Profile</span>
          </a>

          <a id="topbar-settings-link" href="/StepCare/admin/settings/admin-settings.html" class="flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-neutral-700 hover:text-[#3C52C3] hover:bg-neutral-50 transition">
            <i data-lucide="settings" class="w-4 h-4 text-neutral-400"></i>
            <span>Settings</span>
          </a>
        </div>

        <div class="pt-1 mt-1 border-t border-neutral-100">
          <button id="open-logout-btn" type="button" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-red-600 hover:bg-red-50/70 transition cursor-pointer">
            <i data-lucide="log-out" class="w-4 h-4 text-red-600"></i>
            <span>Log out</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</header>

<!-- Global Enlarged Logout Confirmation Modal -->
<div id="topbar-logout-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 items-center justify-center hidden">
  <div class="bg-white rounded-[2rem] p-8 w-full max-w-md shadow-2xl border border-neutral-200 flex flex-col items-center text-center">
    <div class="flex items-center justify-center w-16 h-16 rounded-2xl bg-red-50 text-red-600 mb-5">
      <i data-lucide="log-out" class="w-8 h-8"></i>
    </div>
    <h3 class="text-xl font-bold text-neutral-900 mb-2">Confirm Log Out</h3>
    <p class="text-sm text-neutral-500 mb-8 max-w-xs leading-relaxed">Are you sure you want to log out of your StepCare account?</p>
    <div class="flex gap-4 w-full">
      <button id="cancel-topbar-logout" type="button" class="flex-1 py-3 rounded-2xl border border-neutral-200 text-neutral-700 font-bold text-xs hover:bg-neutral-50 transition cursor-pointer">Cancel</button>
      <button id="confirm-topbar-logout" type="button" class="flex-1 py-3 rounded-2xl bg-red-600 text-white font-bold text-xs hover:bg-red-700 transition cursor-pointer shadow-sm">Log Out</button>
    </div>
  </div>
</div>

<script>
(function() {
  function initTopbar() {
    if (window.lucide) lucide.createIcons();

    const notifBtn      = document.getElementById('topbar-notif-btn');
    const notifDropdown = document.getElementById('topbar-notif-dropdown');
    const userBtn       = document.getElementById('user-menu-btn');
    const userDropdown  = document.getElementById('user-dropdown-menu');
    const openLogout    = document.getElementById('open-logout-btn');
    const logoutModal   = document.getElementById('topbar-logout-modal');
    const cancelLogout  = document.getElementById('cancel-topbar-logout');
    const confirmLogout = document.getElementById('confirm-topbar-logout');
    const markAllBtn    = document.getElementById('topbar-mark-all-read');

    const nameEl        = document.getElementById('topbar-user-name');
    const initialEl     = document.getElementById('topbar-avatar-initials');
    const profileLink   = document.getElementById('topbar-profile-link');
    const settingsLink  = document.getElementById('topbar-settings-link');
    const seeAllNotif   = document.getElementById('topbar-see-all-notif');

    // Detect portal context (Nurse or Admin) based on current path
    const currentPath = window.location.pathname.toLowerCase();
    const isNurseContext = currentPath.includes('/nurse/');
    const roleParam = isNurseContext ? 'nurse' : 'admin';

    // Synchronize identity from centralized backend API
    function syncRoleIdentity() {
      fetch(`/StepCare/auth/get_current_user.php?role=${roleParam}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === 'success' && res.user) {
            const u = res.user;

            // Update Name
            if (nameEl) nameEl.textContent = u.fullName || 'User';
            
            // Update Destination Links
            if (profileLink && u.profileLink) profileLink.href = u.profileLink;
            if (settingsLink && u.settingsLink) settingsLink.href = u.settingsLink;
            if (seeAllNotif) {
              seeAllNotif.href = isNurseContext 
                ? '/StepCare/nurse/notifications/notifications.html' 
                : '/StepCare/admin/notifications/notifications.html';
            }

            // Update Avatar / Initial
            if (u.photoURL) {
              userBtn.innerHTML = `<img src="/StepCare/${u.photoURL}?t=${Date.now()}" class="w-full h-full object-cover rounded-full">`;
            } else {
              userBtn.innerHTML = `<span id="topbar-avatar-initials">${(u.fullName || 'U').charAt(0).toUpperCase()}</span>`;
            }
          }
        })
        .catch(err => console.error("Identity sync failed:", err));
    }

    syncRoleIdentity();

    // Toggle Notifications Dropdown
    if (notifBtn && notifDropdown) {
      notifBtn.onclick = function(e) {
        e.stopPropagation();
        if (userDropdown) userDropdown.classList.add('hidden');
        notifDropdown.classList.toggle('hidden');
      };
    }

    // Toggle User Menu Dropdown
    if (userBtn && userDropdown) {
      userBtn.onclick = function(e) {
        e.stopPropagation();
        if (notifDropdown) notifDropdown.classList.add('hidden');
        userDropdown.classList.toggle('hidden');
      };
    }

    // Close on Outside Click
    document.addEventListener('click', function(e) {
      if (notifDropdown && !notifDropdown.contains(e.target) && !notifBtn.contains(e.target)) {
        notifDropdown.classList.add('hidden');
      }
      if (userDropdown && !userDropdown.contains(e.target) && !userBtn.contains(e.target)) {
        userDropdown.classList.add('hidden');
      }
    });

    // Logout Modal Control
    if (openLogout && logoutModal) {
      openLogout.onclick = function(e) {
        e.stopPropagation();
        if (userDropdown) userDropdown.classList.add('hidden');
        logoutModal.classList.remove('hidden');
        logoutModal.classList.add('flex');
      };
      if (cancelLogout) {
        cancelLogout.onclick = function() {
          logoutModal.classList.add('hidden');
          logoutModal.classList.remove('flex');
        };
      }
      if (confirmLogout) {
        confirmLogout.onclick = function() {
          localStorage.clear();
          window.location.href = '/StepCare/loginNsignup/login.php';
        };
      }
    }

    // Load Notifications for active role
    function loadTopbarNotifications() {
      fetch(`/StepCare/auth/notification-actions.php?action=fetch_summary&role=${roleParam}&user_id=1`)
        .then(r => r.json())
        .then(data => {
          const dot   = document.getElementById('topbar-notif-dot');
          const count = document.getElementById('topbar-notif-count');
          const list  = document.getElementById('topbar-notif-list');
          if (!list) return;

          const unreadNum = parseInt(data.unread_count || 0);

          if (unreadNum > 0) {
            if (dot) dot.style.display = 'block';
            if (count) count.textContent = `${unreadNum} unread`;
          } else {
            if (dot) dot.style.display = 'none';
            if (count) count.textContent = `0 unread`;
          }

          if (!data.success || !data.notifications || data.notifications.length === 0) {
            list.innerHTML = `
              <div class="py-8 text-center px-4">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-[#3C52C3] flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="party-popper" class="w-6 h-6"></i>
                </div>
                <h4 class="text-sm font-bold text-neutral-800">You're all caught up</h4>
                <p class="text-[11px] text-neutral-400 mt-1 max-w-[200px] mx-auto leading-relaxed">
                  We'll notify you when there are important changes or updates to see.
                </p>
              </div>
            `;
            if (window.lucide) lucide.createIcons();
            return;
          }

          const detailBase = isNurseContext 
            ? '/StepCare/nurse/notifications/notifications-detailed.html?id=' 
            : '/StepCare/admin/notifications/notifications-detailed.html?id=';

          list.innerHTML = data.notifications.map(n => {
            const isUnread = (parseInt(n.isRead) === 0);
            return `
              <a href="${detailBase}${n.notificationID}" 
                 class="flex items-start gap-3 py-3 px-2 rounded-2xl hover:bg-neutral-50 transition group ${isUnread ? 'bg-indigo-50/30' : ''}">
                <span class="w-2 h-2 rounded-full ${isUnread ? 'bg-[#3C52C3]' : 'bg-transparent'} mt-1.5 shrink-0"></span>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between mb-0.5">
                    <span class="text-xs ${isUnread ? 'font-bold text-neutral-900' : 'font-medium text-neutral-700'} truncate">${n.senderName || 'System Alert'}</span>
                    <span class="text-[10px] text-neutral-400 font-normal shrink-0 ml-2">${new Date(n.createdAt).toLocaleDateString()}</span>
                  </div>
                  <p class="text-xs ${isUnread ? 'font-bold text-neutral-900' : 'font-normal text-neutral-500'} truncate">${n.title}</p>
                </div>
              </a>
            `;
          }).join('');
          if (window.lucide) lucide.createIcons();
        })
        .catch(err => console.error("Notification load error:", err));
    }

    loadTopbarNotifications();

    // Mark All As Read
    if (markAllBtn) {
      markAllBtn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();

        const fd = new FormData();
        fd.append('action', 'mark_all_read');
        fd.append('role', roleParam);
        fd.append('user_id', 1);

        fetch('/StepCare/auth/notification-actions.php', { method: 'POST', body: fd })
          .then(r => r.json())
          .then(res => {
            if (res.success) {
              loadTopbarNotifications();
              if (typeof window.loadNotifications === 'function') {
                window.loadNotifications();
              }
            } else {
              alert("Error: " + res.message);
            }
          })
          .catch(err => console.error("Mark read error:", err));
      };
    }
  }

  setTimeout(initTopbar, 15);
})();
</script>

<!-- Global Topbar Component -->
<header id="topbar" class="bg-white border-b border-neutral-200 h-16 px-8 flex items-center justify-between sticky top-0 z-30">
  
  <!-- Left: Page Title -->
  <div class="flex items-center gap-3">
    <h1 id="topbar-page-title" class="text-xl font-bold text-neutral-900 tracking-tight">
      Dashboard
    </h1>
  </div>

  <!-- Right: User Avatar Dropdown Anchor -->
  <div class="relative">
    <!-- User Avatar Trigger Button -->
    <button id="user-menu-btn" type="button" class="w-10 h-10 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-sm hover:ring-4 hover:ring-neutral-100 transition cursor-pointer overflow-hidden border border-neutral-300">
      <span id="topbar-avatar-initials">A</span>
    </button>

    <!-- Dropdown Menu Panel -->
    <div id="user-dropdown-menu" class="hidden absolute right-0 mt-3 w-60 bg-white rounded-2xl shadow-xl border border-neutral-200 py-2.5 z-50 transition-all duration-150">
      
      <!-- User Info Header -->
      <div class="px-4 py-2 border-b border-neutral-100">
        <p class="text-[11px] font-medium text-neutral-400">Signed in as</p>
        <p id="topbar-user-name" class="text-sm font-bold text-neutral-800 truncate mt-0.5">Administrator</p>
      </div>

      <!-- Actions -->
      <div class="py-1">
        <a id="topbar-settings-link" href="/StepCare/admin/settings.html" class="flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-neutral-700 hover:text-black hover:bg-neutral-50 transition">
          <i data-lucide="settings" class="w-4 h-4 text-neutral-500"></i>
          <span>Settings</span>
        </a>

        <button id="copy-userid-btn" type="button" class="w-full flex items-center justify-between px-4 py-2.5 text-xs font-semibold text-neutral-700 hover:text-black hover:bg-neutral-50 transition cursor-pointer">
          <span class="flex items-center gap-3">
            <i data-lucide="copy" class="w-4 h-4 text-neutral-500"></i>
            <span>Copy User ID</span>
          </span>
          <span id="copy-badge" class="text-[10px] text-emerald-600 font-bold hidden">Copied!</span>
        </button>
      </div>

      <!-- Logout -->
      <div class="pt-1 mt-1 border-t border-neutral-100">
        <button id="open-logout-btn" type="button" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-red-600 hover:bg-red-50/70 transition cursor-pointer">
          <i data-lucide="log-out" class="w-4 h-4 text-red-600"></i>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Global Logout Confirmation Modal -->
<div id="topbar-logout-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 items-center justify-center hidden">
  <div id="topbar-logout-content" class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-neutral-200">
    <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-50 text-red-600 mx-auto mb-4">
      <i data-lucide="alert-circle" class="w-6 h-6"></i>
    </div>
    <h3 class="text-base font-bold text-center text-neutral-900 mb-1">Confirm Log Out</h3>
    <p class="text-xs text-center text-neutral-500 mb-6 leading-relaxed">Are you sure you want to log out? You will be returned to the sign-in screen.</p>
    
    <div class="flex gap-3">
      <button id="cancel-topbar-logout" type="button" class="flex-1 py-2.5 rounded-xl border border-neutral-200 text-neutral-700 font-semibold text-xs hover:bg-neutral-100 transition cursor-pointer">
        Cancel
      </button>
      <button id="confirm-topbar-logout" type="button" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-semibold text-xs hover:bg-red-700 transition cursor-pointer shadow-sm">
        Log Out
      </button>
    </div>
  </div>
</div>

  <!-- Self-contained Controller -->
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="hidden" onload="(function(){
    const sidebar = document.getElementById('admin-sidebar');
    if (!sidebar || sidebar.dataset.initialized) return;
    sidebar.dataset.initialized = 'true';

    const toggleBtn = document.getElementById('toggle-sidebar-btn');
    const iconWrap = document.getElementById('toggle-sidebar-icon-wrap');
    const textLabels = sidebar.querySelectorAll('.sidebar-text');
    const pkgIconWrap = document.getElementById('packages-icon-wrap');

    // 1. Super Admin Exclusie controller
    const userRole = localStorage.getItem('stepcare_role') || sessionStorage.getItem('adminRole') || 'admin';
    if (userRole !== 'super_admin' && userRole !== 'superadmin') {
      sidebar.querySelectorAll('.superadmin-only').forEach(el => el.remove());
    }

    // 2. 当前路由高亮
    const currentPath = window.location.pathname.toLowerCase();
    sidebar.querySelectorAll('.sidebar-item').forEach(item => {
      const pageKey = item.getAttribute('data-page');
      if (pageKey && currentPath.includes(pageKey.toLowerCase())) {
        item.classList.add('bg-[#EEF2FF]', 'text-[#3C52C3]', 'font-bold');
        item.classList.remove('text-neutral-600');
      }
    });

    // 3. Badges
    window.syncBadgesAndDots = async function() {
      const isCollapsed = sidebar.classList.contains('w-[72px]');
      let counts = { verifications: 0, schedule: 0, applications: 0, reviews: 0, notifications: 0 };

      try {
        const res = await fetch('/StepCare/components/sidebar-badges.php');
        if (res.ok) {
          const data = await res.json();
          if (data && data.counts) {
            counts = data.counts;
          }
        }
      } catch (e) {}

      const pageMappings = [
        { key: 'verifications', badgeId: 'badge-verifications', dotId: 'dot-verifications' },
        { key: 'schedule', badgeId: 'badge-schedule', dotId: 'dot-schedule' },
        { key: 'applications', badgeId: 'badge-applications', dotId: 'dot-applications' },
        { key: 'reviews', badgeId: 'badge-reviews', dotId: 'dot-reviews' },
        { key: 'notifications', badgeId: 'badge-notifications', dotId: 'dot-notifications' }
      ];

      pageMappings.forEach(item => {
        const val = counts[item.key] || 0;
        const badge = document.getElementById(item.badgeId);
        const dot = document.getElementById(item.dotId);

        if (val > 0) {
          if (badge) {
            badge.textContent = val > 99 ? '99+' : val;
            badge.classList.remove('hidden');
          }
          if (dot) {
            dot.classList.toggle('hidden', !isCollapsed);
          }
        } else {
          if (badge) badge.classList.add('hidden');
          if (dot) dot.classList.add('hidden');
        }
      });

      // Package icon turns purple during hide status
      if (pkgIconWrap) {
        if (isCollapsed) {
          pkgIconWrap.classList.add('text-purple-600');
        } else {
          pkgIconWrap.classList.remove('text-purple-600');
        }
      }
    };

    // 4. Sidebar collapse / open controller（Fixed icon px-6）
    function applyCollapse(collapse) {
      if (collapse) {
        sidebar.classList.remove('w-52');
        sidebar.classList.add('w-[72px]');

        textLabels.forEach(el => {
          el.style.maxWidth = '0px';
          el.style.opacity = '0';
          el.style.marginLeft = '0px';
        });

        if (iconWrap) iconWrap.innerHTML = '<i data-lucide=\'panel-left-open\' class=\'w-5 h-5\'></i>';
        localStorage.setItem('stepcare_admin_sidebar_collapsed', 'true');
      } else {
        sidebar.classList.remove('w-[72px]');
        sidebar.classList.add('w-52');

        textLabels.forEach(el => {
          el.style.maxWidth = '140px';
          el.style.opacity = '1';
          el.style.marginLeft = '0.875rem';
        });

        if (iconWrap) iconWrap.innerHTML = '<i data-lucide=\'panel-left-close\' class=\'w-5 h-5\'></i>';
        localStorage.setItem('stepcare_admin_sidebar_collapsed', 'false');
      }

      window.syncBadgesAndDots();
      if (window.lucide) lucide.createIcons();
    }

    const isCollapsed = localStorage.getItem('stepcare_admin_sidebar_collapsed') === 'true';
    if (isCollapsed) applyCollapse(true);
    else window.syncBadgesAndDots();

    if (toggleBtn) {
      toggleBtn.onclick = function(e) {
        e.preventDefault();
        applyCollapse(!sidebar.classList.contains('w-[72px]'));
      };
    }

    if (window.lucide) lucide.createIcons();
  })()" />

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Set New Password — StepCare</title>
</head>

<body class="min-h-dvh antialiased">

  <div class="fixed inset-0 -z-10 overflow-hidden">
    <img src="../../images/loginNsignup.jpg" alt="" class="h-full w-full object-cover" />
    <div class="absolute inset-0 bg-white/50 backdrop-blur-md"></div>
  </div>

  <main class="flex min-h-dvh items-center justify-center p-4">
    <div class="w-full max-w-xl rounded-3xl bg-white ring-1 ring-white/60 p-10 md:p-14">

      <div class="text-center mb-8">
        <img src="../images/StepCare.png" alt="StepCare"
             class="h-16 w-16 mx-auto object-contain mb-3" />
        <p class="text-4xl font-bold tracking-tight">
          <span class="text-[#3C52C3]">Step</span><span class="text-[#10B981]">Care</span>
        </p>
        <h1 class="mt-6 text-2xl font-bold text-[#3C52C3]">Set New Password</h1>
      </div>

      <!-- The form (hidden until JS confirms a token exists) -->
      <form action="saveNewPassword.php" method="POST"
            class="flex-col gap-5 hidden" id="resetForm">
        <input type="hidden" name="token" id="tokenInput" value="" />

        <div class="flex flex-col gap-2">
          <label for="password" class="text-base font-medium text-slate-700">New password</label>
          <input id="password" type="password" name="password" required minlength="8"
                 placeholder="At least 8 characters"
                 class="w-full rounded-lg border border-slate-300 bg-white/80
                        px-5 py-3.5 text-base placeholder-slate-400 outline-none transition
                        focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="confirmPassword" class="text-base font-medium text-slate-700">Confirm new password</label>
          <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8"
                 placeholder="Re-enter password"
                 class="w-full rounded-lg border border-slate-300 bg-white/80
                        px-5 py-3.5 text-base placeholder-slate-400 outline-none transition
                        focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
        </div>

        <p id="formError" class="text-sm text-red-500 hidden"></p>

        <div class="flex items-center justify-between gap-4 mt-2">
          <a href="../login/login.html"
             class="text-base font-semibold text-[#3C52C3] hover:text-[#007FFF] transition">
            Cancel
          </a>
          <button type="submit"
                  class="rounded-lg bg-[#3C52C3] px-8 py-3.5 font-medium text-base text-white
                         transition duration-300 hover:-translate-y-0.5 hover:bg-[#007FFF] active:scale-95">
            Reset password
          </button>
        </div>
      </form>

      <!-- Error block (hidden until JS confirms an error) -->
      <div class="text-center hidden" id="errorBlock">
        <p class="text-red-500 font-medium" id="errorText"></p>
        <a href="forgotPassword.html"
           class="mt-6 inline-block rounded-lg bg-[#3C52C3] px-6 py-3 text-white font-medium
                  hover:bg-[#007FFF] transition">
          Request a new link
        </a>
      </div>

    </div>
  </main>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const token  = params.get('token');
    const error  = params.get('error');

    const form       = document.getElementById('resetForm');
    const errorBlock = document.getElementById('errorBlock');
    const errorText  = document.getElementById('errorText');
    const tokenInput = document.getElementById('tokenInput');

    if (token) {
      /* Valid token → show the form */
      tokenInput.value = token;
      form.classList.remove('hidden');
      form.classList.add('flex');

      /* Client-side check: passwords match + length */
      form.addEventListener('submit', function (e) {
        const p1  = document.getElementById('password').value;
        const p2  = document.getElementById('confirmPassword').value;
        const err = document.getElementById('formError');

        if (p1.length < 8) {
          e.preventDefault();
          err.textContent = 'Password must be at least 8 characters.';
          err.classList.remove('hidden');
          return;
        }
        if (p1 !== p2) {
          e.preventDefault();
          err.textContent = 'Passwords do not match.';
          err.classList.remove('hidden');
        }
      });

    } else {
      /* No token → show error */
      const messages = {
        invalid:       'This reset link is invalid.',
        used:          'This reset link has already been used.',
        expired:       'This reset link has expired (links are valid for 10 minutes).',
        missing_token: 'No reset token was provided.',
      };
      errorText.textContent = messages[error] || 'Something went wrong. Please request a new link.';
      errorBlock.classList.remove('hidden');
    }
  })();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Sign up — StepCare</title>
</head>

<body class="min-h-dvh antialiased">

  <!-- Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <img src="../../images/loginNsignup.jpg" alt="" class="h-full w-full object-cover" />
    <div class="absolute inset-0 bg-white/50 backdrop-blur-md"></div>
  </div>

  <main class="flex min-h-dvh items-center justify-center p-4">

    <!-- Wide card (max-w-5xl) -->
    <div class="w-full max-w-5xl rounded-3xl bg-white ring-1 ring-white/60 p-8 md:p-12">

      <!-- Back link -->
      <a href="../login/login.html"
         class="inline-flex items-center gap-1 text-sm text-slate-500 font-medium mb-4
                transition duration-300 hover:text-[#3C52C3] hover:-translate-x-1 md:text-base">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Back to Login
      </a>

      <!-- Logo + title (horizontal) -->
      <div class="flex items-center gap-3 mb-8">
        <img src="../../images/StepCare.png" alt="StepCare" class="h-12 w-12 object-contain" />
        <p class="text-4xl font-bold tracking-tight">
          <span class="text-[#3C52C3]">Step</span><span class="text-[#10B981]">Care</span>
        </p>
      </div>

      <h1 class="text-2xl font-bold text-[#3C52C3] mb-2">Create your account</h1>
      <p class="text-slate-500 mb-8">Takes less than a minute. Two quick steps.</p>

      <!-- Step indicator -->
      <div class="flex items-center gap-4 mb-10">
        <div class="flex items-center gap-2" id="stepIndicator1">
          <span class="w-8 h-8 rounded-full bg-[#3C52C3] text-white
                       flex items-center justify-center text-sm font-bold">1</span>
          <span class="text-sm font-semibold text-[#3C52C3]">Your Details</span>
        </div>
        <div class="flex-1 h-px bg-slate-200"></div>
        <div class="flex items-center gap-2" id="stepIndicator2">
          <span class="w-8 h-8 rounded-full bg-slate-200 text-slate-500
                       flex items-center justify-center text-sm font-bold">2</span>
          <span class="text-sm font-semibold text-slate-400">Set Password</span>
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- FORM                                                          -->
      <!-- ============================================================ -->
      <form id="signupForm" action="signup.php" method="POST" novalidate>

        <!-- ======================================= -->
        <!-- STEP 1 — Personal details (grid rows)   -->
        <!-- ======================================= -->
        <div id="step1" class="flex flex-col gap-6">

          <!-- Row 1: first + last name -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
              <label for="firstName" class="text-sm font-medium text-slate-700">
                First name <span class="text-red-500">*</span>
              </label>
              <input id="firstName" name="firstName" maxlength="50" required
                     placeholder="e.g. Jonsen"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="lastName" class="text-sm font-medium text-slate-700">
                Last name <span class="text-red-500">*</span>
              </label>
              <input id="lastName" name="lastName" maxlength="50" required
                     placeholder="e.g. Tan"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
          </div>

          <!-- Row 2: email + phone -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
              <label for="email" class="text-sm font-medium text-slate-700">
                Email <span class="text-red-500">*</span>
              </label>
              <input id="email" type="email" name="email" required
                     placeholder="you@gmail.com"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="phoneNumber" class="text-sm font-medium text-slate-700">
                Phone number <span class="text-red-500">*</span>
              </label>
              <input id="phoneNumber" type="tel" name="phoneNumber" required maxlength="20"
                     placeholder="+60 12-345 6789"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
          </div>

          <!-- Row 3: IC + gender + DOB -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="flex flex-col gap-1.5">
              <label for="IC" class="text-sm font-medium text-slate-700">IC / Passport</label>
              <input id="IC" name="IC" maxlength="20"
                     placeholder="e.g. 010203-14-5678"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="gender" class="text-sm font-medium text-slate-700">Gender</label>
              <select id="gender" name="gender"
                      class="w-full rounded-lg border border-slate-300 bg-white
                             px-4 py-3 text-base text-slate-800
                             outline-none transition
                             focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40">
                <option value="">Select…</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="dateOfBirth" class="text-sm font-medium text-slate-700">Date of birth</label>
              <input id="dateOfBirth" type="date" name="dateOfBirth"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
          </div>

          <!-- Row 4: address (full width) -->
          <div class="flex flex-col gap-1.5">
            <label for="address" class="text-sm font-medium text-slate-700">Address</label>
            <input id="address" name="address" maxlength="500"
                   placeholder="Your home address"
                   class="w-full rounded-lg border border-slate-300 bg-white
                          px-4 py-3 text-base text-slate-800 placeholder-slate-400
                          outline-none transition
                          focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
          </div>

          <!-- Row 5: emergency contact (2 columns) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
              <label for="emergencyContactName" class="text-sm font-medium text-slate-700">
                Emergency contact name <span class="text-red-500">*</span>
              </label>
              <input id="emergencyContactName" name="emergencyContactName" required maxlength="100"
                     placeholder="e.g. Mary Tan"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="emergencyContactPhone" class="text-sm font-medium text-slate-700">
                Emergency contact phone <span class="text-red-500">*</span>
              </label>
              <input id="emergencyContactPhone" type="tel" name="emergencyContactPhone"
                     required maxlength="20"
                     placeholder="+60 12-345 6789"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
          </div>

          <!-- Next button -->
          <div class="flex justify-end mt-4">
            <button type="button" id="toStep2"
                    class="rounded-lg bg-[#3C52C3] px-8 py-3 font-medium text-white
                           transition duration-300 hover:-translate-y-0.5 hover:bg-[#007FFF]
                           active:scale-95">
              Next →
            </button>
          </div>
        </div>

        <!-- ======================================= -->
        <!-- STEP 2 — Password                        -->
        <!-- ======================================= -->
        <div id="step2" class="hidden flex-col gap-6">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
              <label for="password" class="text-sm font-medium text-slate-700">
                Password <span class="text-red-500">*</span>
              </label>
              <input id="password" type="password" name="password" required minlength="8"
                     placeholder="Create a strong password"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="confirmPassword" class="text-sm font-medium text-slate-700">
                Confirm password <span class="text-red-500">*</span>
              </label>
              <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8"
                     placeholder="Re-enter password"
                     class="w-full rounded-lg border border-slate-300 bg-white
                            px-4 py-3 text-base text-slate-800 placeholder-slate-400
                            outline-none transition
                            focus:border-[#3C52C3] focus:ring-2 focus:ring-[#007FFF]/40" />
            </div>
          </div>

          <!-- Password requirements list -->
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-5">
            <p class="text-sm font-semibold text-slate-700 mb-3">Your password must contain:</p>
            <ul class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-6 text-sm">

              <li id="req-length" class="flex items-center gap-2 text-slate-400 transition">
                <span class="dot w-5 h-5 rounded-full bg-slate-300 flex items-center justify-center
                             text-white text-xs font-bold">✓</span>
                At least 8 characters
              </li>

              <li id="req-letter" class="flex items-center gap-2 text-slate-400 transition">
                <span class="dot w-5 h-5 rounded-full bg-slate-300 flex items-center justify-center
                             text-white text-xs font-bold">✓</span>
                At least 1 letter (a–z, A–Z)
              </li>

              <li id="req-number" class="flex items-center gap-2 text-slate-400 transition">
                <span class="dot w-5 h-5 rounded-full bg-slate-300 flex items-center justify-center
                             text-white text-xs font-bold">✓</span>
                At least 1 number (0–9)
              </li>

              <li id="req-symbol" class="flex items-center gap-2 text-slate-400 transition">
                <span class="dot w-5 h-5 rounded-full bg-slate-300 flex items-center justify-center
                             text-white text-xs font-bold">✓</span>
                At least 1 symbol (!@#$%…)
              </li>

            </ul>
          </div>

          <!-- Back + Submit -->
          <div class="flex items-center justify-between mt-4">
            <button type="button" id="toStep1"
                    class="text-base font-semibold text-[#3C52C3] hover:text-[#007FFF] transition">
              ← Back to details
            </button>
            <button type="submit"
                    class="rounded-lg bg-[#3C52C3] px-8 py-3 font-medium text-white
                           transition duration-300 hover:-translate-y-0.5 hover:bg-[#007FFF]
                           active:scale-95">
              Create account
            </button>
          </div>
        </div>

      </form>
    </div>
  </main>

  <script src="signup.js"></script>
</body>
</html>

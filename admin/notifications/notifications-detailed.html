<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepCare - Notification Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white h-screen w-screen flex text-neutral-800 antialiased overflow-hidden">

  <!-- Sidebar -->
  <div id="sidebar-container" class="shrink-0 h-full"></div>

  <!-- Workspace -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <!-- Topbar -->
    <div id="topbar-container" class="w-full shrink-0"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-8 overflow-y-auto">
      <div class="w-full bg-white border border-neutral-200 rounded-3xl p-8 shadow-sm space-y-6">
        
        <!-- Header Action Bar -->
        <div class="flex items-center justify-between border-b border-neutral-100 pb-4">
          <a href="/StepCare/admin/notifications/notifications.html" class="inline-flex items-center gap-2 text-xs font-semibold text-neutral-500 hover:text-black transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back to Notifications</span>
          </a>

          <!-- Author Controls -->
          <div id="author-controls" class="hidden items-center gap-2">
            <button id="btn-edit-notif" class="px-3.5 py-1.5 border border-neutral-200 rounded-xl text-xs font-semibold hover:bg-neutral-50 transition flex items-center gap-1.5">
              <i data-lucide="edit-3" class="w-3.5 h-3.5 text-neutral-600"></i>
              <span>Edit</span>
            </button>
            <button id="btn-delete-notif" class="px-3.5 py-1.5 border border-red-200 text-red-600 rounded-xl text-xs font-semibold hover:bg-red-50 transition flex items-center gap-1.5">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              <span>Delete</span>
            </button>
          </div>
        </div>

        <!-- Sender & Recipients Profile -->
        <div class="flex items-center justify-between pb-2">
          <div class="flex items-center gap-4">
            <div id="sender-avatar" class="w-12 h-12 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-base overflow-hidden border border-neutral-200 shrink-0">
              S
            </div>
            <div>
              <div class="flex items-center gap-2.5">
                <h3 id="sender-name" class="text-sm font-bold text-neutral-900"></h3>
                <span id="sender-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border capitalize"></span>
              </div>
              <p id="notif-time" class="text-[11px] text-neutral-400 mt-0.5"></p>
            </div>
          </div>

          <!-- Target Audience Recipients Badges -->
          <div class="flex items-center gap-2">
            <span class="text-xs text-neutral-400 font-medium">Delivered to:</span>
            <div id="recipients-badges" class="flex items-center gap-1.5"></div>
          </div>
        </div>

        <!-- Body Message -->
        <div class="space-y-4 pt-2">
          <h2 id="notif-title" class="text-2xl font-black text-neutral-900 tracking-tight"></h2>
          <div id="notif-body" class="text-sm text-neutral-700 leading-relaxed whitespace-pre-line border-t border-neutral-100 pt-4"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Multi-Role Edit Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 items-center justify-center hidden">
    <div class="bg-white rounded-3xl p-8 w-full max-w-2xl shadow-2xl border border-neutral-200">
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-neutral-100">
        <h3 class="text-lg font-bold text-neutral-900">Edit Notification</h3>
        <button type="button" id="close-edit-x" class="text-neutral-400 hover:text-black">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="edit-form" class="space-y-4">
        <!-- Target Audience Checkboxes -->
        <div>
          <label class="block text-xs font-bold text-neutral-700 uppercase mb-2">Target Roles</label>
          <div class="grid grid-cols-3 gap-3">
            <label class="flex items-center gap-2 p-3 rounded-xl border border-neutral-200 cursor-pointer bg-neutral-50/50">
              <input type="checkbox" id="edit-role-admin" value="admin" class="w-4 h-4 text-[#3C52C3] rounded focus:ring-0" />
              <span class="text-xs font-semibold text-neutral-800">Administrators</span>
            </label>
            <label class="flex items-center gap-2 p-3 rounded-xl border border-neutral-200 cursor-pointer bg-neutral-50/50">
              <input type="checkbox" id="edit-role-nurse" value="nurse" class="w-4 h-4 text-[#3C52C3] rounded focus:ring-0" />
              <span class="text-xs font-semibold text-neutral-800">Nurses</span>
            </label>
            <label class="flex items-center gap-2 p-3 rounded-xl border border-neutral-200 cursor-pointer bg-neutral-50/50">
              <input type="checkbox" id="edit-role-user" value="user" class="w-4 h-4 text-[#3C52C3] rounded focus:ring-0" />
              <span class="text-xs font-semibold text-neutral-800">Users</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-neutral-700 uppercase mb-2">Title</label>
          <input type="text" id="edit-title" required class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:outline-none focus:border-[#3C52C3] font-medium" />
        </div>

        <div>
          <label class="block text-xs font-bold text-neutral-700 uppercase mb-2">Message</label>
          <textarea id="edit-message" rows="5" required class="w-full px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:outline-none focus:border-[#3C52C3] font-medium"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2 border-t border-neutral-100">
          <button type="button" id="close-edit-btn" class="px-5 py-2.5 border border-neutral-200 rounded-xl text-xs font-semibold hover:bg-neutral-50">Cancel</button>
          <button type="submit" class="px-6 py-2.5 bg-[#3C52C3] hover:bg-[#3245a8] text-white rounded-xl text-xs font-semibold transition">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch('/StepCare/components/sidebar-admin.html').then(r => r.text()).then(h => {
        document.getElementById('sidebar-container').innerHTML = h;
        lucide.createIcons();
      });
      fetch('/StepCare/components/topbar.html').then(r => r.text()).then(h => {
        const c = document.getElementById('topbar-container');
        c.innerHTML = h;
        document.getElementById('topbar-page-title').textContent = "Notifications";
        lucide.createIcons();
      });

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = '/StepCare/admin/notifications/notifications.html';
        return;
      }

      // Fetch Detail Record
      fetch(`/StepCare/auth/notification-actions.php?action=get_detail&id=${id}&role=admin&user_id=1`)
        .then(r => r.json())
        .then(res => {
          if (!res.success) {
            alert(res.message);
            window.location.href = '/StepCare/admin/notifications/notifications.html';
            return;
          }

          const d = res.data;
          document.getElementById('sender-name').textContent = d.senderName || 'System Alert';
          document.getElementById('notif-title').textContent = d.title;
          document.getElementById('notif-body').textContent = d.message;
          document.getElementById('notif-time').textContent = new Date(d.createdAt).toLocaleString();

          // Sender Role Badge
          const badge = document.getElementById('sender-badge');
          if (d.senderType === 'nurse') {
            badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold border bg-sky-50 text-sky-700 border-sky-200';
            badge.textContent = 'Nurse';
          } else if (d.senderType === 'admin') {
            badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold border bg-emerald-50 text-emerald-700 border-emerald-200';
            badge.textContent = 'Admin';
          } else {
            badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold border bg-neutral-100 text-neutral-600 border-neutral-200';
            badge.textContent = 'System';
          }

          // Recipients Badges
          const badgeBox = document.getElementById('recipients-badges');
          const roles = d.recipients_list && d.recipients_list.length > 0 ? d.recipients_list : [d.recipientType];
          badgeBox.innerHTML = roles.map(r => `
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border capitalize bg-neutral-100 text-neutral-700 border-neutral-200">${r}</span>
          `).join('');

          // Avatar
          const avatar = document.getElementById('sender-avatar');
          if (d.senderPhoto) {
            avatar.innerHTML = `<img src="${d.senderPhoto}" class="w-full h-full object-cover">`;
          } else {
            avatar.textContent = (d.senderName ? d.senderName.charAt(0).toUpperCase() : 'S');
          }

          // Author Controls (Edit & Delete)
          if (d.can_manage) {
            const controls = document.getElementById('author-controls');
            controls.classList.remove('hidden');
            controls.classList.add('flex');

            document.getElementById('btn-delete-notif').onclick = () => {
              if (!confirm("Delete this notification?")) return;
              const fd = new FormData();
              fd.append('action', 'delete');
              fd.append('role', 'admin');
              fd.append('user_id', 1);
              fd.append('notificationID', id);

              fetch('/StepCare/auth/notification-actions.php', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(r => {
                  if (r.success) window.location.href = '/StepCare/admin/notifications/notifications.html';
                  else alert(r.message);
                });
            };

            const editModal = document.getElementById('edit-modal');
            document.getElementById('btn-edit-notif').onclick = () => {
              document.getElementById('edit-title').value = d.title;
              document.getElementById('edit-message').value = d.message;
              document.getElementById('edit-role-admin').checked = roles.includes('admin');
              document.getElementById('edit-role-nurse').checked = roles.includes('nurse');
              document.getElementById('edit-role-user').checked = roles.includes('user');

              editModal.classList.remove('hidden');
              editModal.classList.add('flex');
            };

            const hideEdit = () => { editModal.classList.add('hidden'); editModal.classList.remove('flex'); };
            document.getElementById('close-edit-btn').onclick = hideEdit;
            document.getElementById('close-edit-x').onclick = hideEdit;

            document.getElementById('edit-form').onsubmit = (e) => {
              e.preventDefault();
              const selectedRoles = [];
              if (document.getElementById('edit-role-admin').checked) selectedRoles.push('admin');
              if (document.getElementById('edit-role-nurse').checked) selectedRoles.push('nurse');
              if (document.getElementById('edit-role-user').checked) selectedRoles.push('user');

              if (selectedRoles.length === 0) {
                alert("Please check at least one recipient role.");
                return;
              }

              const fd = new FormData();
              fd.append('action', 'update');
              fd.append('role', 'admin');
              fd.append('user_id', 1);
              fd.append('notificationID', id);
              fd.append('title', document.getElementById('edit-title').value);
              fd.append('message', document.getElementById('edit-message').value);
              selectedRoles.forEach(r => fd.append('recipientTypes[]', r));

              fetch('/StepCare/auth/notification-actions.php', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(r => {
                  if (r.success) location.reload();
                  else alert(r.message);
                });
            };
          }
        });
    });
  </script>
</body>
</html>

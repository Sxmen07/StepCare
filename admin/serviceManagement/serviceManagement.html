<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Management - StepCare Admin</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/StepCare/admin/serviceManagement/serviceManagement.css">
</head>
<body class="bg-slate-50 text-neutral-800 font-sans flex h-screen overflow-hidden antialiased">

  <!-- Admin Sidebar Component -->
  <div id="sidebar-container" class="shrink-0 h-full"></div>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    
    <!-- Topbar Component -->
    <div id="topbar-container" class="shrink-0"></div>

    <!-- Scrollable Main Content -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
      
      <!-- Search Bar Section -->
      <section class="max-w-5xl mx-auto pt-2">
        <div class="relative w-full shadow-sm rounded-2xl group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-neutral-400 group-focus-within:text-[#3C52C3] transition-colors">
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <input type="text" 
                 id="service-search-input" 
                 placeholder="Search by service title, description, or category..." 
                 class="w-full pl-11 pr-10 py-3.5 bg-white border border-neutral-200 rounded-2xl text-sm text-neutral-800 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3] transition-all">
          <button type="button" 
                  id="clear-search-btn" 
                  class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-400 hover:text-neutral-600 transition">
            <i data-lucide="x-circle" class="w-5 h-5"></i>
          </button>
        </div>
      </section>

      <!-- Services Display Section -->
      <section class="pt-2">
        
        <!-- Category Pills (Left) & Add Service Button (Right) Row -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-5">
          
          <!-- Sliding Pill Category Selector Container (Left End) -->
          <div class="relative flex items-center justify-start overflow-hidden w-full sm:w-auto">
            <div id="category-pills-wrapper" class="relative inline-flex items-center gap-1.5 p-1 bg-transparent rounded-2xl overflow-x-auto max-w-full no-scrollbar select-none">
              <div id="pill-highlight" class="absolute bg-white rounded-xl shadow-sm border border-neutral-200/80 transition-all duration-300 ease-out z-0 pointer-events-none"></div>

              <button data-category="all" class="category-pill relative z-10 px-4 py-2 text-xs font-bold rounded-xl transition-colors duration-200 text-[#3C52C3]">All Services</button>
              <button data-category="Elderly" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">Elderly Care</button>
              <button data-category="Post-op" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">Post-Op</button>
              <button data-category="Neuro" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">Neuro Care</button>
              <button data-category="Postnatal" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">Postnatal</button>
              <button data-category="Hospice" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">Hospice</button>
              <button data-category="Chronic" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">Chronic Care</button>
            </div>
          </div>

          <!-- Add Service Button (Right End) -->
          <div class="shrink-0 w-full sm:w-auto flex justify-end">
            <button type="button" 
                    id="btn-open-add-modal"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#3C52C3] hover:bg-[#3244a8] text-white text-xs font-bold rounded-2xl shadow-sm hover:shadow-md transition cursor-pointer whitespace-nowrap">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Add Service</span>
            </button>
          </div>

        </div>

        <!-- Counter & View Mode Toggle Bar -->
        <div class="flex items-center justify-between mb-4 px-1">
          <p id="service-count-text" class="text-xs font-bold text-neutral-500 uppercase tracking-wider">Loading services...</p>

          <div class="relative inline-flex items-center gap-1 p-1 bg-transparent select-none">
            <div id="view-pill-highlight" class="absolute bg-white rounded-xl shadow-sm border border-neutral-200/80 transition-all duration-300 ease-out z-0 pointer-events-none"></div>
            <button type="button" data-view="card" class="view-pill relative z-10 p-2 rounded-xl text-[#3C52C3] font-bold transition-colors cursor-pointer flex items-center justify-center" title="Grid View"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
            <button type="button" data-view="list" class="view-pill relative z-10 p-2 rounded-xl text-neutral-500 font-semibold transition-colors cursor-pointer flex items-center justify-center" title="List View"><i data-lucide="list" class="w-4 h-4"></i></button>
          </div>
        </div>

        <!-- Cards / List Container -->
        <div id="services-wrapper" class="transition-all duration-300 ease-out opacity-100 transform translate-y-0">
          <div id="services-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
          <div class="w-16 h-16 bg-neutral-100 text-neutral-400 rounded-3xl flex items-center justify-center mb-4"><i data-lucide="layers-slash" class="w-8 h-8"></i></div>
          <h3 class="text-base font-bold text-neutral-800">No Services Found</h3>
          <p class="text-xs text-neutral-500 mt-1 max-w-sm">We couldn't find any services matching your filter parameters.</p>
        </div>
      </section>

    </main>
  </div>

  <!-- ADD / EDIT SERVICE MANAGEMENT MODAL -->
  <div id="service-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl border border-neutral-200 flex flex-col">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-neutral-100 flex items-center justify-between sticky top-0 bg-white z-10">
        <h3 id="modal-title" class="text-lg font-black text-neutral-900">Add New Service</h3>
        <button type="button" id="close-service-modal" class="p-2 text-neutral-400 hover:text-neutral-700 transition cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Tab Navigation (Outer vs Inner) -->
      <div class="flex border-b border-neutral-100 px-6 pt-2 bg-neutral-50/50">
        <button type="button" onclick="switchModalTab('outer')" id="tab-btn-outer" class="px-4 py-2.5 text-xs font-bold text-[#3C52C3] border-b-2 border-[#3C52C3] transition cursor-pointer">1. Outer Page Details</button>
        <button type="button" onclick="switchModalTab('inner')" id="tab-btn-inner" class="px-4 py-2.5 text-xs font-semibold text-neutral-500 hover:text-neutral-800 transition cursor-pointer">2. Inner Page Details</button>
      </div>

      <!-- Modal Form -->
      <form id="service-form" class="p-6 space-y-5">
        <input type="hidden" id="form-service-id" name="serviceID">
        <input type="hidden" id="form-existing-image" name="existingImage">

        <!-- TAB 1: OUTER PAGE DETAILS -->
        <div id="modal-tab-outer" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-neutral-700 mb-1">Service Title *</label>
              <input type="text" id="form-service-name" name="serviceName" required placeholder="e.g., Post-Operative Wound Care" class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3]">
            </div>
            <div>
              <label class="block text-xs font-bold text-neutral-700 mb-1">Category *</label>
              <select id="form-category" name="category" required class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3]">
                <option value="Elderly">Elderly Care</option>
                <option value="Post-op">Post-Op</option>
                <option value="Neuro">Neuro Care</option>
                <option value="Postnatal">Postnatal</option>
                <option value="Hospice">Hospice</option>
                <option value="Chronic">Chronic Care</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-neutral-700 mb-1">Service Fee (RM) *</label>
              <input type="number" step="0.01" id="form-price" name="price" required placeholder="85.00" class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3]">
            </div>
            <div>
              <label class="block text-xs font-bold text-neutral-700 mb-1">Min Duration (Mins)</label>
              <input type="number" id="form-duration-min" name="durationMin" value="45" class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3]">
            </div>
            <div>
              <label class="block text-xs font-bold text-neutral-700 mb-1">Max Duration (Mins)</label>
              <input type="number" id="form-duration-max" name="durationMax" value="60" class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3]">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-neutral-700 mb-1">Service Image</label>
            <input type="file" id="form-service-image" name="serviceImage" accept="image/*" class="w-full text-xs text-neutral-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-[#3C52C3] hover:file:bg-indigo-100 cursor-pointer">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-bold text-neutral-700">What's Included (Features)</label>
              <button type="button" onclick="addFeatureInput()" class="text-[11px] font-bold text-[#3C52C3] hover:underline">+ Add Feature</button>
            </div>
            <div id="features-container" class="space-y-2 max-h-36 overflow-y-auto pr-1">
              <!-- Dynamically populated feature rows -->
            </div>
          </div>
        </div>

        <!-- TAB 2: INNER PAGE DETAILS -->
        <div id="modal-tab-inner" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-neutral-700 mb-1">Detailed Description (Inner Page Content)</label>
            <textarea id="form-description" name="description" rows="4" placeholder="Provide comprehensive details about this healthcare service..." class="w-full px-3.5 py-2.5 bg-neutral-50 border border-neutral-200 rounded-xl text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3]"></textarea>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-bold text-neutral-700">Available Time Slots</label>
              <button type="button" onclick="addSlotInput()" class="text-[11px] font-bold text-[#3C52C3] hover:underline">+ Add Time Slot</button>
            </div>
            <div id="timeslots-container" class="space-y-2 max-h-40 overflow-y-auto pr-1">
              <!-- Dynamically populated time slot rows -->
            </div>
          </div>
        </div>

        <!-- Modal Footer Actions -->
        <div class="pt-4 border-t border-neutral-100 flex items-center justify-end gap-3">
          <button type="button" id="cancel-service-modal" class="px-5 py-2.5 rounded-xl border border-neutral-200 text-neutral-700 text-xs font-bold hover:bg-neutral-50 transition cursor-pointer">Cancel</button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-[#3C52C3] hover:bg-[#3244a8] text-white text-xs font-bold transition shadow-sm cursor-pointer">Save Service</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Page Logic JavaScript -->
  <script src="/StepCare/admin/serviceManagement/serviceManagement.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Management - StepCare Admin</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/StepCare/admin/serviceManagement/serviceManagement.css">
</head>
<body class="bg-slate-50 text-neutral-800 font-sans flex h-screen overflow-hidden antialiased">

  <!-- Admin Sidebar Component -->
  <div id="sidebar-container" class="shrink-0 h-full"></div>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    
    <!-- Topbar Component -->
    <div id="topbar-container" class="shrink-0"></div>

    <!-- Scrollable Main Content -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
      
      <!-- Center Search & Filter Section with Add Button Next to Categories -->
      <section class="max-w-4xl mx-auto space-y-5 pt-2">
        
        <!-- Center Search Bar Component -->
        <div class="relative w-full shadow-sm rounded-2xl group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-neutral-400 group-focus-within:text-[#3C52C3] transition-colors">
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <input type="text" 
                 id="service-search-input" 
                 placeholder="Search by service title, description, or category..." 
                 class="w-full pl-11 pr-10 py-3.5 bg-white border border-neutral-200 rounded-2xl text-sm text-neutral-800 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-[#3C52C3]/20 focus:border-[#3C52C3] transition-all">
          <button type="button" 
                  id="clear-search-btn" 
                  class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-400 hover:text-neutral-600 transition">
            <i data-lucide="x-circle" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Categories Pill & Add Button Row -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
          
          <!-- Sliding Pill Category Selector Container -->
          <div class="relative flex items-center flex-1 justify-center sm:justify-start overflow-hidden w-full sm:w-auto">
            <div id="category-pills-wrapper" class="relative inline-flex items-center gap-1.5 p-1.5 bg-neutral-200/60 rounded-2xl overflow-x-auto max-w-full no-scrollbar select-none">
              
              <!-- Sliding Background Indicator Pill -->
              <div id="pill-highlight" class="absolute bg-white rounded-xl shadow-sm border border-neutral-200/80 transition-all duration-300 ease-out z-0 pointer-events-none"></div>

              <!-- Dynamic Category Buttons -->
              <button data-category="all" class="category-pill relative z-10 px-4 py-2 text-xs font-bold rounded-xl transition-colors duration-200 text-[#3C52C3]">
                All Services
              </button>
              <button data-category="Elderly" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">
                Elderly Care
              </button>
              <button data-category="Post-op" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">
                Post-Op
              </button>
              <button data-category="Neuro" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">
                Neuro Care
              </button>
              <button data-category="Postnatal" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">
                Postnatal
              </button>
              <button data-category="Hospice" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">
                Hospice
              </button>
              <button data-category="Chronic" class="category-pill relative z-10 px-4 py-2 text-xs font-semibold rounded-xl transition-colors duration-200 text-neutral-600 hover:text-neutral-900">
                Chronic Care
              </button>
            </div>
          </div>

          <!-- Add Service Button (Placed on the right of categories pill) -->
          <div class="shrink-0">
            <button type="button" 
                    id="btn-add-service-placeholder"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#3C52C3] hover:bg-[#3244a8] text-white text-xs font-bold rounded-2xl shadow-sm hover:shadow-md transition cursor-pointer whitespace-nowrap">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Add Service</span>
            </button>
          </div>

        </div>
      </section>

      <!-- Services Display Grid Section -->
      <section class="pt-2">
        <div class="flex items-center justify-between mb-4 px-1">
          <p id="service-count-text" class="text-xs font-bold text-neutral-500 uppercase tracking-wider">
            Loading services...
          </p>
        </div>

        <!-- Dynamic Service Cards Grid -->
        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State View -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
          <div class="w-16 h-16 bg-neutral-100 text-neutral-400 rounded-3xl flex items-center justify-center mb-4">
            <i data-lucide="layers-slash" class="w-8 h-8"></i>
          </div>
          <h3 class="text-base font-bold text-neutral-800">No Services Found</h3>
          <p class="text-xs text-neutral-500 mt-1 max-w-sm">We couldn't find any services matching your current filter parameters or search keyword.</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Page Logic JavaScript -->
  <script src="/StepCare/admin/serviceManagement/serviceManagement.js"></script>
</body>
</html>
